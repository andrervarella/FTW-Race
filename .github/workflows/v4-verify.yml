name: FTW Race V4 public browser verification

on:
  push:
    branches: ['codex/ftw-race-v4-arcade']
    paths:
      - 'game/**'
      - '.github/workflows/v4-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser tooling
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Read the published build preceding Marquinhos for the cache regression
        uses: actions/checkout@v4
        with:
          ref: cc8d5b70d0dd9f113fbdd83ddf0814968e54bcdb
          path: work/old-cache-runtime
          persist-credentials: false
      - name: Verify immutable releases with a previously cached build
        run: |
          python game/tests/published_runtime.py
          python game/tests/cache-release.py --old-game work/old-cache-runtime/game --output work/v4-live/cache-release
      - name: Verify the published V4 in mobile Chromium
        run: |
          python game/tests/v4-live.py https://andrervarella.github.io/FTW-Race/teste-v4/ --wait-ready 180 --output work/v4-live
      - name: Verify live music, engine and effects after trusted activation
        run: |
          python game/tests/audio-live.py https://andrervarella.github.io/FTW-Race/teste-v4/ --output work/v4-live/audio-live
      - name: Measure the actual truck renderer, all views and larger collision footprint
        run: |
          python game/tests/marquinhos-live.py https://andrervarella.github.io/FTW-Race/teste-v4/ --output work/v4-live/marquinhos-live
      - name: Preserve browser screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ftw-v4-public-chromium-${{ github.run_id }}
          path: work/v4-live/
          if-no-files-found: error
          retention-days: 7
