<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:#23323d;overflow:hidden}#world{position:fixed;inset:0}#label{position:fixed;top:5px;left:8px;color:#fff;background:#071526dd;font:12px monospace;padding:6px;pointer-events:none}</style></head><body><div id="world"></div><div id="label">NPC sprite regression fixture</div><script type="module">
import { buildTrack } from '../src/track.js';
import { createRace } from '../src/sim.js';
import { createRaceScene } from '../src/render.js';
const m=await import('../assets/legacy/phaser-Czz4FBZH.js');const Phaser=m.g(m.r());
const track=buildTrack();const race=createRace(track,'daniel');race.phase='paused';race.player.distance=300;
race.cpu.distance=450;race.cpu.lateral=.4;
for(const [i,d]of race.extras.entries()){d.distance=300+[4,14,26,42][i];d.lateral=[-.6,.7,-.7,.7][i];d.speed=40;}
window.npcRace=race;window.npcErrors=[];
const Scene=createRaceScene(Phaser,{assets:new URL('../assets/legacy/',import.meta.url).href,track,getRace:()=>race,onReady:()=>window.npcReady=true,onError:e=>window.npcErrors.push(String(e))});
window.npcGame=new Phaser.Game({type:Phaser.AUTO,parent:'world',width:innerWidth,height:innerHeight,audio:{noAudio:true},scene:[Scene]});
</script></body></html>
